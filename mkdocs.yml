site_name: h5pack
repo_url: https://github.com/eagomez2/h5pack
repo_name: eagomez2/h5pack
nav:
  - About: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - Documentation:
    - Overview: docs.md
    - h5pack init documentation: init.md
    - h5pack pack documentation: pack.md
    - h5pack unpack documentation: unpack.md
    - h5pack info documentation: info.md
    - h5pack virtual documentation: virtual.md
    - h5pack checksum documentation: checksum.md
    - h5pack show documentation: show.md
    - h5pack verify documentation: verify.md
  - Guides:
    - Parsers: parsers.md
    - Reading data in Python: reading.md
    - Saving space: space.md
  - Changelog: https://github.com/eagomez2/h5pack/releases
  - License: license.md
copyright: |
  &copy; 2025 <a href="https://www.estebangomez.me" target="_blank">Esteban Gómez</a>, <a href="https://www.aalto.fi/en/department-of-information-and-communications-engineering/speech-interaction-technology" target="_blank">Speech Interaction Technology, Aalto University</a>
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - navigation.instant
    - navigation.instant.progress
    - search.share
  language: en
  logo: assets/logo-inverted.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/logo.svg
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: custom
      accent: custom
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: custom
      accent: custom
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eagomez2/h5pack
      name: h5pack on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/h5pack/
      name: h5pack on PyPI
  generator: false
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - pymdownx.arithmatex:
      generic: true
plugins:
  - search
  - mkdocstrings:
      enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
      # custom_templates: templates
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            line_length: 79
  - autorefs
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - js/tablesort.js